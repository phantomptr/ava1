name: release

# A `vX.Y.Z` tag makes a GitHub pre-release with the C sources as an archive. Promoting it to a
# full release (the `released` event) publishes the crates to crates.io, when the repository has
# a CARGO_REGISTRY_TOKEN secret. No user-controlled input reaches a shell command.
on:
  push:
    tags: ['v*']
  release:
    types: [released]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prerelease:
    if: github.event_name == 'push'
    name: pre-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: The tag is the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "tag $TAG but Cargo.toml says $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: The crates package
        run: make package
      - name: C sources archive
        run: |
          name="ava1-c-$VERSION"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD \
            c schema spec vectors examples/c scripts Makefile README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Release notes from CHANGELOG.md
        run: awk -v v="## $VERSION" '$0==v{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > notes.md
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --prerelease --title "AVA1 $VERSION" --notes-file notes.md \
            "ava1-c-$VERSION.tar.gz" "ava1-c-$VERSION.tar.gz.sha256"

  crates:
    if: github.event_name == 'release'
    name: publish to crates.io
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: cargo publish (ava1-gen, then ava1)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::No CARGO_REGISTRY_TOKEN secret: the crates are published by hand."
            exit 0
          fi
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          for c in ava1-gen ava1; do
            if cargo search "$c" --limit 1 | grep -q "^$c = \"$version\""; then
              echo "$c $version is already on crates.io"
            else
              cargo publish -p "$c"
            fi
          done
