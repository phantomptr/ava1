name: release

# A `vX.Y.Z` tag makes a GitHub pre-release with the C sources as an archive. Promoting it to a
# full release (the `released` event) publishes the crates to crates.io (see the `crates` job for
# the credentials). No user-controlled input reaches a shell command.
on:
  push:
    tags: ['v*']
  release:
    types: [released]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prerelease:
    if: github.event_name == 'push'
    name: pre-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: The tag is the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "tag $TAG but Cargo.toml says $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: The crates package
        run: make package
      - name: C sources archive
        run: |
          name="ava1-c-$VERSION"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD \
            c schema spec vectors examples/c scripts Makefile README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Release notes from CHANGELOG.md
        run: awk -v v="## $VERSION" '$0==v{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > notes.md
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --prerelease --title "AVA1 $VERSION" --notes-file notes.md \
            "ava1-c-$VERSION.tar.gz" "ava1-c-$VERSION.tar.gz.sha256"

  # Credentials: crates.io trusted publishing (OIDC, a token that lives for this job only) once
  # each crate names this repository and release.yml as a trusted publisher on crates.io. A crate
  # must exist before it can have one, so the first release uses a CARGO_REGISTRY_TOKEN secret
  # instead; delete the secret once trusted publishing is set up.
  crates:
    if: github.event_name == 'release'
    name: publish to crates.io
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      HAS_SECRET: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Trusted publishing token
        id: auth
        if: env.HAS_SECRET != 'true'
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: cargo publish (ava1-gen, then ava1)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::No crates.io credential: set up trusted publishing for both crates, or add a CARGO_REGISTRY_TOKEN secret (the first release)."
            exit 1
          fi
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          for c in ava1-gen ava1; do
            if cargo search "$c" --limit 1 | grep -q "^$c = \"$version\""; then
              echo "$c $version is already on crates.io"
            else
              cargo publish -p "$c"
            fi
          done
