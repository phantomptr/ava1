name: ci

# Every push to main and every pull request. Tags are the release workflow's. No user-controlled
# input is interpolated into a shell command anywhere in this file.
on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: fmt, clippy, generated code
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('Cargo.lock') }}
      - run: make fmt-check
      - run: make lint
      - name: Generated codecs match schema/ava1.toml
        run: make gen-check
      - name: Docs build without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps -p ava1 -p ava1-gen

  test:
    name: rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('Cargo.lock') }}
      - run: make test-rust
      - name: C frame AEAD (RFC 8439 + Monocypher differential; AVX2 on x86-64)
        run: make aead

  windows:
    name: rust build (windows)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo build -p ava1 -p ava1-gen --examples
      - run: cargo test -p ava1-gen

  msrv:
    name: rust build (MSRV, rust-version in Cargo.toml)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The toolchain Cargo.toml names
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - run: cargo +"$MSRV" build -p ava1 -p ava1-gen --examples --locked

  ctest:
    name: C interop ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ctest-${{ hashFiles('Cargo.lock') }}
      # The C server and data layer are process-wide singletons: one test at a time.
      - name: cargo test -p ava1-ctest (serial)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t args < <(python3 .github/scripts/ctest-shard.py "$SHARD" 2)
          cargo test -p ava1-ctest "${args[@]}" -- --test-threads=1

  sanitize:
    name: C interop, ASan + UBSan ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-18-dev
      - name: cargo test -p ava1-ctest (sanitized, serial)
        env:
          SHARD: ${{ matrix.shard }}
          CC: clang
          AVA1_CTEST_SANITIZE: "1"
          RUSTFLAGS: -Clinker=clang
          ASAN_OPTIONS: detect_leaks=1
        run: |
          export LSAN_OPTIONS="suppressions=$GITHUB_WORKSPACE/crates/ava1-ctest/lsan.supp"
          mapfile -t args < <(python3 .github/scripts/ctest-shard.py "$SHARD" 2)
          cargo test -p ava1-ctest "${args[@]}" -- --test-threads=1

  c:
    name: C library (gcc, clang) and the examples end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y clang
      - name: libava1.a with gcc and clang, -Wall -Wextra -Werror
        run: make c-check
      - name: C example node + Rust example client (pair, send twice, compare)
        run: make interop

  fuzz:
    name: fuzz C and Rust decoders
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-18-dev
      - name: C decoders and data-plane parsers (60 s each)
        run: make fuzz-c
      - name: Rust decoders (60 s + 30 s)
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
          make fuzz-rust

  package:
    name: cargo package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: make package

  # The one check a branch protection rule needs to name.
  gate:
    name: ci gate
    if: always()
    needs: [lint, test, windows, msrv, ctest, sanitize, c, fuzz, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a required job ended with: $r"; exit 1; }
          done
