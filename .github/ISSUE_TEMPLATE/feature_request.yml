name: Feature request
description: Suggest something new for the crates, the C library or the protocol
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case. "I can't do X because..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: The feature or change you have in mind.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      multiple: true
      options:
        - Rust crate (ava1)
        - C library (libava1)
        - Code generator (ava1-gen)
        - The protocol itself
        - Documentation or examples
    validations:
      required: true
  - type: dropdown
    id: wire
    attributes:
      label: Does it need a protocol change?
      description: Version 1 peers already run in the field. Many things fit in an application method (docs/extending.md) or stay on one side.
      options:
        - No, it stays inside one side's API
        - It could be an application method
        - Yes, it needs new frames or fields
        - Not sure
    validations:
      required: true
  - type: textarea
    id: compat
    attributes:
      label: Older peers
      description: If it changes the protocol, how should a peer that doesn't know about it behave?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other ways to get the same result.
