name: Bug report
description: A transfer, pairing or connection that goes wrong, or a crate or the C library misbehaving
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security issues go privately to the maintainer instead (see SECURITY.md).
        If the Rust crate and the C library disagree about the protocol, or the spec looks wrong, use **Protocol or interop problem** instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
      placeholder: "When I upload a folder with ..., the job ends with ERR_VERIFY instead of ..."
    validations:
      required: true
  - type: dropdown
    id: doing
    attributes:
      label: What were you doing?
      multiple: true
      options:
        - Pairing (the code, or the first connection)
        - Connecting to a device that is already paired
        - Uploading files or folders
        - Downloading files or folders
        - Copying or moving on the node
        - Resuming or cancelling a job
        - An application method (docs/extending.md)
        - Building or generating code
        - Something else
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      multiple: true
      options:
        - Rust crate (ava1), client side
        - Rust crate (ava1), server or receiver side
        - C library (libava1)
        - Code generator (ava1-gen)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "e.g. ava1 1.0.7, or the commit you built the C library from"
    validations:
      required: true
  - type: input
    id: peer
    attributes:
      label: The other side
      description: What runs on the other end of the connection, and its version.
      placeholder: "e.g. the C node in ps5upload 11.6.0 on a PS5 (firmware 9.60)"
  - type: input
    id: platform
    attributes:
      label: Your platform
      placeholder: "e.g. macOS 15 on Apple Silicon, Windows 11 x86-64, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Error code
      description: The `ERR_*` code or status number you got, if any.
      placeholder: "e.g. ERR_STALLED, ERR_PATH, 13"
  - type: input
    id: size
    attributes:
      label: How much data
      description: For transfer problems, roughly how many files and how big, and the network (Wi-Fi, wired, the same machine).
      placeholder: "e.g. 40,000 files, 85 GB, wired gigabit"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The error and a few lines around it. The library's diagnostic lines go to standard error unless you set `ava1::diag::set_sink`. Remove anything private, such as pairing codes or keys.
      render: shell
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest program or the exact steps that show it, if you have them.
      placeholder: "1. ...\n2. ...\n3. ..."
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Once
        - Sometimes
        - Every time
