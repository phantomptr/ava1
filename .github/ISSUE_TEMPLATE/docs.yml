name: Documentation
description: Something in the README, the docs, the API docs or the spec's wording is missing, wrong or confusing
labels: ["documentation"]
body:
  - type: input
    id: where
    attributes:
      label: Where?
      description: The file, section or docs.rs page.
      placeholder: "e.g. docs/c-library.md, \"Pairing\"; or docs.rs/ava1 Client::connect"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would help?
      description: The wording or example you'd like to see, if you have one.
