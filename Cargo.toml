[workspace]
exclude = ["crates/ava1/fuzz"]
members = [
  "crates/ava1",
  "crates/ava1-gen",
  "crates/ava1-chaos",
  "crates/ava1-ctest",
]
# Version 3 picks dependency versions that build with rust-version.
resolver = "3"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "1.0.5"
# File::lock (1.89). CI builds the published crates with exactly this version.
rust-version = "1.89"
repository = "https://github.com/phantomptr/ava1"
homepage = "https://github.com/phantomptr/ava1"
authors = ["phantomptr"]

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
