# files travel whole as BundleRecords. A protocol constant: both sides use it.
[[const]]
name = "LARGE_CUTOFF"
ty = "u32"
value = 262144
[[const]]
name = "BN_NONE"
ty = "u8"
value = 0
[[const]]
name = "BN_NETWORK"
ty = "u8"
value = 1
[[const]]
name = "BN_SOURCE"
ty = "u8"
value = 2
[[const]]
name = "BN_DISK"
ty = "u8"
value = 3
[[const]]
name = "BN_WORKERS"
ty = "u8"
value = 4
[[const]]
name = "BN_CREDIT"
ty = "u8"
value = 5
[[const]]
name = "RETRY_VERIFY"
ty = "u16"
value = 1
[[const]]
name = "RETRY_IO"
ty = "u16"
value = 2
[[const]]
name = "RETRY_CHANGED"
ty = "u16"
value = 3

[[struct]]
name = "ManifestEntry"
fields = [
  { name = "file_id", ty = "u32" },
  { name = "kind", ty = "u8" },
  { name = "mode", ty = "u32" },
  { name = "size", ty = "u64" },
  { name = "mtime", ty = "u64" },        # seconds since the Unix epoch
  { name = "path", ty = "str" },         # relative, '/'-separated (SPEC.md §11.2)
]
ext = [{ tag = 1, name = "root", ty = "b32" }]   # policy verify only

[[struct]]
name = "FileRun"            # files first..first+count are complete
fields = [{ name = "first", ty = "u32" }, { name = "count", ty = "u32" }]

[[struct]]
name = "FileRange"          # bytes offset..offset+len of a file
fields = [{ name = "file_id", ty = "u32" }, { name = "offset", ty = "u64" }, { name = "len", ty = "u64" }]

[[struct]]
name = "BundleRecord"       # one whole small file
fields = [{ name = "file_id", ty = "u32" }, { name = "root", ty = "b32" }, { name = "data", ty = "bytes" }]

[[struct]]
name = "RootItem"
fields = [{ name = "file_id", ty = "u32" }, { name = "root", ty = "b32" }]

[[message]]
name = "JobOpen"
type = 0x20
fields = [
  { name = "job_id", ty = "b16" },
  { name = "kind", ty = "u8" },
  { name = "policy", ty = "u8" },
  { name = "flags", ty = "u32" },
  { name = "root", ty = "str" },     # upload: destination; download: source
]
ext = [
  { tag = 1, name = "src", ty = "str" },       # JOB_COPY source
  { tag = 2, name = "credit", ty = "u64" },    # JOB_DOWNLOAD: credit the opener grants
]

[[message]]
name = "JobOpenAck"
type = 0x21
fields = [
  { name = "job_id", ty = "b16" },
  { name = "status", ty = "u16" },
  { name = "credit", ty = "u64" },   # JOB_UPLOAD: bytes the sender may have outstanding
  { name = "staged", ty = "u8" },    # 1 = writing under <root>.ava-part/
  { name = "workers", ty = "u8" },
]
ext = [{ tag = 1, name = "message", ty = "str" }]

[[message]]
name = "ManifestPage"
type = 0x22
fields = [{ name = "job_id", ty = "b16" }, { name = "entries", ty = "records", of = "ManifestEntry" }]

[[message]]
name = "ManifestEnd"
type = 0x23
fields = [
  { name = "job_id", ty = "b16" },
  { name = "files", ty = "u32" },
  { name = "bytes", ty = "u64" },
  { name = "manifest_hash", ty = "b32" },
]

[[message]]
name = "JobMap"             # what the receiver already has; everything else is needed
type = 0x24
fields = [
  { name = "job_id", ty = "b16" },
  { name = "status", ty = "u16" },
  { name = "last", ty = "u8" },      # a map can span pages; 1 on the final one
  { name = "done", ty = "records", of = "FileRun" },
  { name = "partial", ty = "records", of = "FileRange" },   # durable ranges of unfinished files
]
# `held` (final page): bytes the drive already holds for this job's unfinished large files (the
# allocated blocks of their part files, at most each file's size). A sender that checks free
# space credits it: those bytes are on the drive already, durable or not (SPEC.md §11.5).
ext = [{ tag = 1, name = "message", ty = "str" }, { tag = 2, name = "held", ty = "u64" }]

[[message]]
name = "Resume"             # fast path: same manifest as before
type = 0x25
fields = [{ name = "job_id", ty = "b16" }, { name = "manifest_hash", ty = "b32" }]

[[message]]
name = "Chunk"              # lanes only
type = 0x26
fields = [
  { name = "job_id", ty = "b16" },
  { name = "file_id", ty = "u32" },
  { name = "offset", ty = "u64" },
  { name = "data", ty = "bytes" },
]

[[message]]
name = "Bundle"             # lanes only
type = 0x27
fields = [{ name = "job_id", ty = "b16" }, { name = "records", ty = "records", of = "BundleRecord" }]

[[message]]
name = "Received"           # a lane frame is in the receiver's memory
type = 0x28
fields = [{ name = "job_id", ty = "b16" }, { name = "lane", ty = "u16" }, { name = "seq", ty = "u32" }]

[[message]]
name = "Credit"             # buffer space returned to the sender
type = 0x29
fields = [{ name = "job_id", ty = "b16" }, { name = "bytes", ty = "u64" }]

[[message]]
name = "Durable"            # synced and journaled
type = 0x2A
fields = [
  { name = "job_id", ty = "b16" },
  { name = "files", ty = "records", of = "FileRun" },
  { name = "ranges", ty = "records", of = "FileRange" },
]

[[message]]
name = "FileRoot"           # a large file's BLAKE3 root, from its sender
type = 0x2B
fields = [{ name = "job_id", ty = "b16" }, { name = "file_id", ty = "u32" }, { name = "root", ty = "b32" }]

[[message]]
name = "FileRetry"          # the receiver dropped this file; send all of it again
type = 0x2C
fields = [{ name = "job_id", ty = "b16" }, { name = "file_id", ty = "u32" }, { name = "reason", ty = "u16" }]

[[message]]
name = "Status"             # every 250 ms, sent IGNORABLE; also the job.status reply body
type = 0x2D
fields = [
  { name = "job_id", ty = "b16" },
  { name = "files_done", ty = "u32" },
  { name = "files_total", ty = "u32" },
  { name = "bytes_received", ty = "u64" },
  { name = "bytes_durable", ty = "u64" },
  { name = "bytes_total", ty = "u64" },
  { name = "bottleneck", ty = "u8" },
  { name = "workers", ty = "u8" },
  { name = "lanes", ty = "u8" },
  { name = "sequential", ty = "u8" },
]
ext = [
  { tag = 1, name = "current", ty = "str" },
  { tag = 2, name = "state", ty = "u8" },
  { tag = 3, name = "result", ty = "bytes" },   # job.run: the finished job's output (a handler's text body)
  { tag = 4, name = "code", ty = "u16" },       # a failed job's ERR_* code
  { tag = 5, name = "unswept", ty = "u32" },    # durable-by-log (SPEC.md §15.7): done files not yet durable in place; absent = 0
]

[[message]]
name = "JobDone"
type = 0x2E
fields = [
  { name = "job_id", ty = "b16" },
  { name = "status", ty = "u16" },
  { name = "files", ty = "u32" },
  { name = "bytes", ty = "u64" },
]
ext = [
  { tag = 1, name = "message", ty = "str" },
  { tag = 2, name = "settling", ty = "u8" },    # 1: the log is durable but files are still being made durable in place (SPEC.md §15.7)
]

[[message]]
name = "JobCancel"
type = 0x2F
fields = [{ name = "job_id", ty = "b16" }, { name = "reason", ty = "u16" }]

# Job-scoped liveness (SPEC.md §12.8): a sender reading past data the receiver already
# holds (a solid archive decoded from its start on resume) sends this at least every
# 10 s; the receiver counts it as progress for that job. Older receivers ignore it.
[[message]]
name = "SkipProgress"
type = 0x30
fields = [{ name = "job_id", ty = "b16" }, { name = "bytes_skipped", ty = "u64" }]

# RPC bodies (SPEC.md §16)
[[struct]]
name = "JobCopy"
fields = [
  { name = "job_id", ty = "b16" },
  { name = "src", ty = "str" },
  { name = "dest", ty = "str" },
  { name = "flags", ty = "u32" },
]

[[struct]]
name = "JobRef"
fields = [{ name = "job_id", ty = "b16" }]

[[struct]]
name = "DiskCalibrate"
fields = [{ name = "dir", ty = "str" }, { name = "files", ty = "u32" }, { name = "size", ty = "u32" }]

[[struct]]
name = "CalPoint"
fields = [
  { name = "workers", ty = "u8" },
  { name = "files_per_s", ty = "u32" },
  { name = "create_us", ty = "u32" },
  { name = "fsync_us", ty = "u32" },
]

[[struct]]
name = "DiskCalibrateResult"
fields = [{ name = "points", ty = "records", of = "CalPoint" }]

# Node to node (SPEC.md §18). key: the sending node's identity; root: where the
# job may write. The reply's token goes to the sender, which shows it in its ClientInfo.
[[struct]]
name = "C2cAllow"
fields = [{ name = "job_id", ty = "b16" }, { name = "key", ty = "b32" }, { name = "root", ty = "str" }]

[[struct]]
name = "C2cTicket"
fields = [{ name = "token", ty = "b16" }]

# key: the receiving node's identity (the handshake must prove it); dest: its root.
[[struct]]
name = "C2cSend"
fields = [
  { name = "job_id", ty = "b16" },
  { name = "host", ty = "str" },
  { name = "port", ty = "u16" },
  { name = "key", ty = "b32" },
  { name = "token", ty = "b16" },
  { name = "src", ty = "str" },
  { name = "dest", ty = "str" },
  { name = "flags", ty = "u32" },
]
[[const]]
name = "METHOD_JOB_RUN"
ty = "u16"
value = 20
[[const]]
name = "METHOD_JOB_LIST"
ty = "u16"
value = 21
# Size constants of the application methods (SPEC.md §7.3-§7.4).
[[const]]
name = "RPC_TEXT_MAX"     # largest MgmtText text in a reply: RPC_REPLY_MAX (256 KiB) minus 16
ty = "u32"
value = 262128

# Bodies shared by application methods and job.run (SPEC.md §7.1.1, §7.3). An application method
# carries opaque text/JSON in MgmtText or a typed struct of its own extension schema.
[[struct]]
name = "MgmtText"
fields = [{ name = "body", ty = "bytes" }]
ext = [{ tag = 1, name = "more", ty = "u8" }]     # 1 = call again with the next offset (paged methods)

[[struct]]
name = "JobRun"
fields = [{ name = "job_id", ty = "b16" }, { name = "op", ty = "u8" }, { name = "args", ty = "bytes" }]

[[struct]]
name = "JobEntry"
fields = [
  { name = "job_id", ty = "b16" },
  { name = "kind", ty = "u8" },
  { name = "state", ty = "u8" },
  { name = "files_done", ty = "u32" },
  { name = "files_total", ty = "u32" },
  { name = "bytes_done", ty = "u64" },
  { name = "bytes_total", ty = "u64" },
]

[[struct]]
name = "JobListResult"
fields = [{ name = "jobs", ty = "records", of = "JobEntry" }]

# Journal records (SPEC.md §14); never on the wire.
[[struct]]
name = "JnlOpen"
fields = [
  { name = "job_id", ty = "b16" },
  { name = "manifest_hash", ty = "b32" },
  { name = "kind", ty = "u8" },
  { name = "flags", ty = "u32" },
  { name = "staged", ty = "u8" },
  { name = "root", ty = "str" },
]

[[struct]]
name = "JnlBatch"
fields = [
  { name = "files", ty = "records", of = "FileRun" },
  { name = "ranges", ty = "records", of = "FileRange" },
  { name = "roots", ty = "records", of = "RootItem" },
]
# Durable-by-log (SPEC.md §15.7): present when the batch wrote small files to the pack log; the byte
# range of this batch's PackFile records inside segment `pack.<segment>`.
ext = [
  { tag = 1, name = "pack_segment", ty = "u32" },
  { tag = 2, name = "pack_offset", ty = "u64" },
  { tag = 3, name = "pack_len", ty = "u64" },
]

[[struct]]
name = "PackRef"            # where a batch's PackFile records live (journal snapshots only)
fields = [
  { name = "segment", ty = "u32" },
  { name = "offset", ty = "u64" },
  { name = "len", ty = "u64" },
  { name = "first_file", ty = "u32" },
  { name = "count", ty = "u32" },
]

[[struct]]
name = "JnlSweep"           # journal kind 6: these files are now durable in place
fields = [{ name = "files", ty = "records", of = "FileRun" }]

[[struct]]
name = "JnlReset"
fields = [{ name = "file_id", ty = "u32" }]

[[struct]]
name = "JnlSnapshot"
fields = [
  { name = "done", ty = "records", of = "FileRun" },
  { name = "ranges", ty = "records", of = "FileRange" },
  { name = "roots", ty = "records", of = "RootItem" },
]
# Records cannot be extensions, so these carry the records' item streams as bytes: `unswept` the
# FileRuns of done files not yet swept, `segments` the PackRefs whose files are not all swept.
ext = [
  { tag = 1, name = "unswept", ty = "bytes" },
  { tag = 2, name = "segments", ty = "bytes" },
]

[[struct]]
name = "JnlDone"
fields = [{ name = "status", ty = "u16" }]
