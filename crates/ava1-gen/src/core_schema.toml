# Job kinds, as seen by the node that receives JobOpen.
[[const]]
name = "JOB_UPLOAD"
ty = "u8"
value = 1
doc = "Job kind: the node that receives the `JobOpen` receives the files (SPEC.md §11.3)."
[[const]]
name = "JOB_DOWNLOAD"
ty = "u8"
value = 2
doc = "Job kind: the node that receives the `JobOpen` sends the files (SPEC.md §11.3)."
[[const]]
name = "JOB_COPY"
ty = "u8"
value = 3
doc = "Job kind: the node copies `src` to the root locally (`job.copy`, SPEC.md §11.3, §15.5)."
[[const]]
name = "POLICY_REPLACE"
ty = "u8"
value = 0
doc = "Job policy: send everything the receiver's map does not list (SPEC.md §11.4)."
[[const]]
name = "POLICY_SKIP_EXISTING"
ty = "u8"
value = 1
doc = "Job policy: the receiver marks a file done when one of the same size and mtime seconds exists (SPEC.md §11.4)."
[[const]]
name = "POLICY_VERIFY"
