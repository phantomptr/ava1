# AVA1 core messages (SPEC.md §3). After editing: `cargo run -p ava1-gen`. Applications extend this
# schema with their own (SPEC.md §7.3, ava1-gen --ext); see docs/extending.md.
# Field types: u8 u16 u32 u64, b16 b32 (fixed bytes), bytes (u32 length), str (u16 length, UTF-8).
# `ext` fields are optional and tagged; decoders skip unknown tags.
# `doc` (optional, on a const, message, struct, field or ext field) becomes the generated item's
# documentation: `///` in Rust, a `/* */` comment in the C header. It may span lines ("""...""")
# and may not contain `/*` or `*/`.

[[const]]
name = "PROTOCOL_VERSION"
ty = "u16"
value = 1
doc = "The protocol version this code speaks: the range in `HelloInfo` and the choice in `ServerInfo` (SPEC.md §5)."
[[const]]
name = "DEFAULT_PORT"
ty = "u16"
value = 9120
doc = "The TCP port a node listens on unless its application picks another (SPEC.md §1)."
[[const]]
name = "MAX_LANES"
ty = "u8"
value = 8
doc = "Data lanes per session; lane ids are 1..=8, lane 0 is the control connection (SPEC.md §1, §9)."
[[const]]
name = "METHOD_NODE_INFO"
ty = "u16"
value = 1
doc = "RPC `node.info`: empty request, `NodeInfo` reply (SPEC.md §7.1)."
[[const]]
name = "METHOD_PAIRING_OPEN"
ty = "u16"
value = 2
doc = "RPC `pairing.open`: `PairingOpen` request, empty reply; opens the pairing window (SPEC.md §5, §7.1)."
[[const]]
name = "METHOD_CRYPTO_BENCH"
ty = "u16"
value = 3
doc = "RPC `crypto.bench`: `CryptoBench` request, `CryptoBenchResult` reply; a diagnostic (SPEC.md §7.1)."
[[const]]
name = "STATUS_OK"
ty = "u16"
value = 0
doc = "`RpcResponse.status` (and job status) for success (SPEC.md §7)."
[[const]]
name = "ERR_NOT_PAIRED"
ty = "u16"
value = 1
doc = "An RPC or a lane join from a session whose pairing is not accepted (SPEC.md §5, §7.2)."
[[const]]
name = "ERR_PAIRING_CLOSED"
ty = "u16"
value = 2
doc = "An unknown client while the pairing window is closed, or an unconfirmed session whose window or 60 s ended (SPEC.md §5, §7.2)."
[[const]]
name = "ERR_UNSUPPORTED_VERSION"
ty = "u16"
value = 3
doc = "The two peers' version ranges do not overlap; sent unsealed (SPEC.md §5, §7.2)."
[[const]]
name = "ERR_PROTOCOL"
ty = "u16"
value = 4
doc = "A frame or body that does not decode or is not allowed where it arrived, or a request the protocol forbids (SPEC.md §7.2)."
[[const]]
name = "ERR_BAD_JOIN"
ty = "u16"
value = 5
doc = "A `Join` for an unknown session, a lane id outside 1..=8, a wrong tag or a replayed nonce (SPEC.md §9, §7.2)."
[[const]]
name = "ERR_UNKNOWN_METHOD"
ty = "u16"
value = 6
doc = "A method the node does not serve (SPEC.md §7.2, §7.3)."
[[const]]
name = "ERR_INTERNAL"
ty = "u16"
value = 7
doc = "The node failed for a reason that is neither the peer's nor the disk's, such as out of memory (SPEC.md §7.2)."
[[const]]
name = "ERR_BUSY"
ty = "u16"
value = 8
doc = "A limit was reached (connections, sessions, in-flight RPCs, jobs, a destination in use, buffer budget); retry later (SPEC.md §7.2, §8)."

# Noise XX handshake messages (SPEC.md §5). `noise` is the raw Noise message; its
# payload is the struct named in the doc, encoded with these same rules.
[[message]]
name = "Hs1"
type = 0x01
doc = "Handshake step 1, client to node, unsealed (SPEC.md §5)."
fields = [{ name = "noise", ty = "bytes", doc = "Noise XX message 1; its payload is a `HelloInfo`, in plaintext." }]

[[message]]
name = "Hs2"
type = 0x02
doc = "Handshake step 2, node to client (SPEC.md §5)."
fields = [{ name = "noise", ty = "bytes", doc = "Noise XX message 2; its payload is a `ServerInfo`, encrypted." }]

[[message]]
name = "Hs3"
type = 0x03
doc = "Handshake step 3, client to node; every later frame on lane 0 is sealed (SPEC.md §5)."
fields = [{ name = "noise", ty = "bytes", doc = "Noise XX message 3; its payload is a `ClientInfo`, encrypted." }]

# First sealed frame from the server, after Hs3: under XX the server learns the
# client's key only in message 3, so "do I know you" cannot travel earlier.
[[message]]
name = "Welcome"
type = 0x04
doc = "The node's first sealed frame, after `Hs3`: whether it knows the client's key (SPEC.md §5 step 4)."
fields = [
  { name = "knows_you", ty = "u8", doc = "Nonzero when the node already trusts the client's key (or a ticket admits it, SPEC.md §18.2); 0 means the client must pair." },
  { name = "nonce_s", ty = "b16", doc = "The reveal of `ServerInfo.pair_commit`: BLAKE2b-256 of it must equal that commit (SPEC.md §4.6). Required, so it cannot be stripped." },
]
ext = [{ tag = 1, name = "launch_proof", ty = "b16", doc = "Proof of the launch token, sent only to the key in this node's trust slot when the slot carries a token (SPEC.md §5.2). Older clients skip it." }]

# Pairing is a PAKE keyed by a random code that only the node's display shows (SPEC.md
# §4.6, §5.5). The client sends PairPakeClient, the node answers PairPakeServer, then the
# client proves it derived the same key with PairConfirm and the node answers PairResult.
[[message]]
name = "PairPakeClient"
type = 0x0D
doc = "Pairing step 1, client to node: the client's CPace public value (SPEC.md §4.6, §5.5)."
fields = [{ name = "y", ty = "b32", doc = "`X25519(x, G)` for a fresh scalar x, with G derived from the handshake hash and the code." }]

[[message]]
name = "PairPakeServer"
type = 0x0E
doc = "Pairing step 2, node to client: the node's CPace public value (SPEC.md §4.6, §5.5)."
fields = [{ name = "y", ty = "b32", doc = "`X25519(x, G)` for the node's fresh scalar x." }]

[[message]]
name = "PairConfirm"
type = 0x05
doc = "Pairing step 3, client to node: the client's key confirmation (SPEC.md §4.6, §5.5)."
fields = [{ name = "mac", ty = "b32", doc = "Keyed BLAKE2b-256(key = K, \"client\" || h). Required." }]

[[message]]
name = "PairResult"
type = 0x06
doc = "Pairing step 4, node to client: the outcome; the session ends unless accepted (SPEC.md §4.6, §5.5)."
fields = [
  { name = "accepted", ty = "u8", doc = "1 when the node verified the client's `mac` and stored its key, else 0." },
  { name = "mac", ty = "b32", doc = "Keyed BLAKE2b-256(key = K, \"server\" || h) when accepted, else zero: the node's key confirmation, which the client checks before it stores the node." },
]

# A data lane (SPEC.md §9). Both nonces are fresh random per join and feed the lane
# keys, so no two joins of one lane id ever share a key (§4.3).
[[message]]
name = "Join"
type = 0x07
doc = "Opens a data lane: the first frame on a new connection, client to node, unsealed (SPEC.md §9)."
fields = [
  { name = "session_id", ty = "b16", doc = "The session's id, from `ServerInfo`." },
  { name = "lane_id", ty = "u16", doc = "The lane, 1..=8." },
  { name = "client_nonce", ty = "b16", doc = "Fresh random per join; feeds the lane keys (SPEC.md §4.3)." },
  { name = "tag", ty = "b16", doc = "The Join proof (SPEC.md §4.5)." },
]

[[message]]
name = "JoinAck"
type = 0x08
doc = "Accepts a `Join`, node to client, unsealed; both sides then seal under the lane's keys (SPEC.md §9)."
fields = [
  { name = "lane_id", ty = "u16", doc = "The lane, as in the `Join`." },
  { name = "server_nonce", ty = "b16", doc = "Fresh random per join; feeds the lane keys (SPEC.md §4.3)." },
  { name = "tag", ty = "b16", doc = "The JoinAck proof (SPEC.md §4.5)." },
]

[[message]]
name = "Ping"
type = 0x09
doc = "Heartbeat, every 2 s by default on every connection, channel 0; answered by `Pong` (SPEC.md §6)."
fields = [
  { name = "seq", ty = "u32", doc = "The sender's sequence number, echoed in the `Pong`." },
  { name = "t_us", ty = "u64", doc = "The sender's monotonic clock in microseconds when the Ping was written; RTT = now - t_us." },
]

[[message]]
name = "Pong"
type = 0x0A
doc = "Answer to a `Ping`, with its values (SPEC.md §6)."
fields = [
  { name = "seq", ty = "u32", doc = "The Ping's `seq`." },
  { name = "t_us", ty = "u64", doc = "The Ping's `t_us`." },
]

[[message]]
name = "Error"
type = 0x0B
doc = "Reports why the connection ends; the sender then closes it (SPEC.md §6, §7.2)."
fields = [
  { name = "code", ty = "u16", doc = "An `ERR_*` code." },
  { name = "message", ty = "str", doc = "The cause, as text." },
]

[[message]]
name = "Bye"
type = 0x0C
doc = "Ends the session (SPEC.md §6)."
fields = [{ name = "reason", ty = "u8", doc = "Not interpreted by version 1; implementations send 0." }]

[[message]]
name = "RpcRequest"
type = 0x60
doc = "An RPC call on the control connection; the frame's channel is the request id (SPEC.md §7)."
fields = [
  { name = "method", ty = "u16", doc = "A `METHOD_*` number, or an application's (SPEC.md §7.1, §7.3)." },
  { name = "body", ty = "bytes", doc = "The method's request body, at most 56 KiB (SPEC.md §7.4)." },
]

[[message]]
name = "RpcResponse"
type = 0x61
doc = "The answer to an `RpcRequest`, on the request's channel (SPEC.md §7)."
fields = [
  { name = "status", ty = "u16", doc = "`STATUS_OK` or an `ERR_*` code (SPEC.md §7.2)." },
  { name = "body", ty = "bytes", doc = "On `STATUS_OK` the method's reply body; on an error the cause as UTF-8 text. At most 256 KiB (SPEC.md §7.4)." },
]

[[struct]]
name = "NodeInfo"
doc = "The `node.info` reply (SPEC.md §7.1)."
fields = [
  { name = "version", ty = "str", doc = "The node software's version." },
  { name = "platform", ty = "str", doc = "The platform the node runs on." },
  { name = "name", ty = "str", doc = "The node's name." },
]
ext = [{ tag = 1, name = "firmware", ty = "str", doc = "The platform's system software version." }]

[[struct]]
name = "HelloInfo"
doc = "The payload of `Hs1`: the protocol versions the client speaks (SPEC.md §5 step 1)."
fields = [
  { name = "version_min", ty = "u16", doc = "The lowest protocol version the client speaks." },
  { name = "version_max", ty = "u16", doc = "The highest protocol version the client speaks." },
  { name = "caps", ty = "u64", doc = "Client capabilities; 0 in version 1." },
]

[[struct]]
name = "ServerInfo"
doc = "The payload of `Hs2` (SPEC.md §5 step 2)."
fields = [
  { name = "version", ty = "u16", doc = "The protocol version the node chose from the client's range." },
  { name = "caps", ty = "u64", doc = "The node's `CAP_*` bits." },
  { name = "session_id", ty = "b16", doc = "Random id of this session; lanes name it in `Join`." },
  { name = "pair_commit", ty = "b32", doc = "BLAKE2b-256(nonce_s), revealed in `Welcome` (SPEC.md §4.6). Kept for wire stability." },
]
ext = [{ tag = 1, name = "name", ty = "str", doc = "The node's name, for the client to show." }]

[[struct]]
name = "ClientInfo"
doc = "The payload of `Hs3` (SPEC.md §5 step 3)."
fields = [{ name = "nonce_c", ty = "b16", doc = "The client's pairing nonce (SPEC.md §4.6). Required; kept for wire stability." }]
ext = [
  { tag = 1, name = "name", ty = "str", doc = "The client's name, which the node stores with its key when they pair." },
  { tag = 2, name = "token", ty = "b16", doc = "A node sending to another node shows the ticket that node's `c2c.allow` handed out; it admits that one key for that one job (SPEC.md §18.2)." },
]

[[struct]]
name = "PairingOpen"
doc = "The `pairing.open` request (SPEC.md §5 step 6, §7.1)."
fields = [{ name = "seconds", ty = "u16", doc = "How long to keep the pairing window open, in seconds; at most 600." }]

[[struct]]
name = "CryptoBench"
doc = "The `crypto.bench` request (SPEC.md §7.1)."
fields = [{ name = "mib", ty = "u16", doc = "How much data to seal and open, in MiB." }]

[[struct]]
name = "CryptoBenchResult"
doc = "The `crypto.bench` reply, a diagnostic (SPEC.md §7.1)."
fields = [
  { name = "bytes", ty = "u64", doc = "The bytes measured." },
  { name = "micros", ty = "u64", doc = "Microseconds to seal `bytes` as 1 MiB frames." },
]
ext = [
  { tag = 1, name = "open_micros", ty = "u64", doc = "Microseconds to open them." },
  { tag = 2, name = "backend", ty = "str", doc = "The ChaCha20 implementation in use: \"avx2\" or \"portable\"." },
]

# ── Data plane (SPEC.md §11–§16) ─────────────────────────────────────────────
# Every data-plane message has `job_id` first: routers read body[0..16].

