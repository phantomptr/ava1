[[struct]]
name = "ManifestEntry"
doc = "One manifest entry, a file or a directory (SPEC.md §11.2, §11.3)."
fields = [
  { name = "file_id", ty = "u32", doc = "The entry's index in manifest order, from 0." },
  { name = "kind", ty = "u8", doc = "`ENTRY_FILE` or `ENTRY_DIR`." },
  { name = "mode", ty = "u32", doc = "Unix permission bits." },
  { name = "size", ty = "u64", doc = "Size in bytes." },
  { name = "mtime", ty = "u64", doc = "Last modification, in seconds since the Unix epoch; 0 when unknown, and always 0 for a directory (SPEC.md §11.4)." },
  { name = "path", ty = "str", doc = "Relative to the job root, '/'-separated (SPEC.md §11.2)." },
]
ext = [{ tag = 1, name = "root", ty = "b32", doc = "The file's BLAKE3 root, under `POLICY_VERIFY` only (SPEC.md §11.4)." }]

[[struct]]
name = "FileRun"
doc = "Files `first..first + count` (records item)."
fields = [
  { name = "first", ty = "u32", doc = "The first file id." },
  { name = "count", ty = "u32", doc = "How many consecutive file ids." },
]

[[struct]]
name = "FileRange"
doc = "Bytes `offset..offset + len` of one file (records item)."
fields = [
  { name = "file_id", ty = "u32", doc = "The file." },
  { name = "offset", ty = "u64", doc = "The first byte." },
  { name = "len", ty = "u64", doc = "The length in bytes." },
]

[[struct]]
name = "BundleRecord"
doc = "One whole small file, inside a `Bundle` (SPEC.md §12.2, §15.2)."
fields = [
  { name = "file_id", ty = "u32", doc = "The file." },
  { name = "root", ty = "b32", doc = "BLAKE3 of `data` (SPEC.md §13.2)." },
  { name = "data", ty = "bytes", doc = "The file's whole content." },
]

[[struct]]
name = "RootItem"
doc = "A file's BLAKE3 root, as the journal records it (records item, SPEC.md §14.2)."
fields = [
  { name = "file_id", ty = "u32", doc = "The file." },
  { name = "root", ty = "b32", doc = "Its BLAKE3 root (SPEC.md §13.1)." },
]

[[message]]
name = "JobOpen"
type = 0x20
doc = "Opens a job, or reopens a known one to resume it; opener to peer, control connection (SPEC.md §11.3, §11.5)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job's id, chosen by the opener (SPEC.md §11.1)." },
  { name = "kind", ty = "u8", doc = "A `JOB_*` kind, as seen by the node that receives this." },
  { name = "policy", ty = "u8", doc = "A `POLICY_*`." },
  { name = "flags", ty = "u32", doc = "`JF_*` bits (SPEC.md §11.8)." },
  { name = "root", ty = "str", doc = "Upload: the destination; download: the source." },
]
ext = [
  { tag = 1, name = "src", ty = "str", doc = "`JOB_COPY`: the source." },
  { tag = 2, name = "credit", ty = "u64", doc = "`JOB_DOWNLOAD`: the credit the opener grants, in bytes (SPEC.md §12.4)." },
]

[[message]]
name = "JobOpenAck"
type = 0x21
doc = "The answer to a `JobOpen` (SPEC.md §11.3)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "status", ty = "u16", doc = "`STATUS_OK` or an `ERR_*` refusal." },
  { name = "credit", ty = "u64", doc = "`JOB_UPLOAD`: lane-frame body bytes the sender may have outstanding (SPEC.md §12.4)." },
  { name = "staged", ty = "u8", doc = "1 when the receiver writes under `<root>.ava-part/` and renames at the end (SPEC.md §11.6)." },
  { name = "workers", ty = "u8", doc = "The receiver's current number of write workers." },
]
ext = [{ tag = 1, name = "message", ty = "str", doc = "The cause of a refusal, as text." }]

[[message]]
name = "ManifestPage"
type = 0x22
doc = "One page of the manifest, sender to receiver; pages are sized to fit a control frame (SPEC.md §11.3, §11.7)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "entries", ty = "records", of = "ManifestEntry", doc = "The next entries, in manifest order." },
]

[[message]]
name = "ManifestEnd"
type = 0x23
doc = "Ends the manifest, sender to receiver (SPEC.md §11.3)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "files", ty = "u32", doc = "How many entries are files." },
  { name = "bytes", ty = "u64", doc = "The files' total size in bytes." },
  { name = "manifest_hash", ty = "b32", doc = "BLAKE3 over every entry, without its ext (SPEC.md §11.3)." },
]

[[message]]
name = "JobMap"
type = 0x24
doc = "What the receiver already has, receiver to sender; everything else is needed. May span pages (SPEC.md §11.5)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "status", ty = "u16", doc = "`STATUS_OK`, or an `ERR_*` such as `ERR_UNKNOWN_JOB` for a `Resume` the receiver cannot serve." },
  { name = "last", ty = "u8", doc = "1 on the final page." },
  { name = "done", ty = "records", of = "FileRun", doc = "Files the receiver already has whole." },
  { name = "partial", ty = "records", of = "FileRange", doc = "Durable ranges of unfinished files." },
]
ext = [
  { tag = 1, name = "message", ty = "str", doc = "The cause of an error status, as text." },
  { tag = 2, name = "held", ty = "u64", doc = """
Final page: bytes the drive already holds for this job's unfinished large files (the allocated
blocks of their part files, at most each file's size). A sender that checks free space credits it;
absent means none is claimed (SPEC.md §11.5).""" },
]

[[message]]
name = "Resume"
type = 0x25
doc = "Fast-path resume when the sender still holds the same manifest; answered by `JobMap` (SPEC.md §11.5)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "manifest_hash", ty = "b32", doc = "The hash of the manifest the sender holds." },
]

[[message]]
name = "Chunk"
type = 0x26
doc = "Part of a large file, on a lane only (SPEC.md §12.2)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "file_id", ty = "u32", doc = "The file." },
  { name = "offset", ty = "u64", doc = "Where `data` starts in the file: a multiple of 1 MiB." },
  { name = "data", ty = "bytes", doc = "Whole 1 MiB groups, except at the end of the file." },
]

[[message]]
name = "Bundle"
type = 0x27
doc = "Small files, whole, on a lane only (SPEC.md §12.2)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "records", ty = "records", of = "BundleRecord", doc = "One record per file." },
]

[[message]]
name = "Received"
type = 0x28
doc = "A lane frame is in the receiver's memory, before any disk work (SPEC.md §12.3)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "lane", ty = "u16", doc = "The lane the frame arrived on." },
  { name = "seq", ty = "u32", doc = "The frame's header channel: the sender's per-job sequence number (SPEC.md §12.1)." },
]

[[message]]
name = "Credit"
type = 0x29
doc = "Buffer space returned to the sender; adds to its window (SPEC.md §12.4)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "bytes", ty = "u64", doc = "Lane-frame body bytes freed." },
]

[[message]]
name = "Durable"
type = 0x2A
doc = "Data synced and journaled, receiver to sender; never paged (SPEC.md §12.6)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "files", ty = "records", of = "FileRun", doc = "Files now complete and durable." },
  { name = "ranges", ty = "records", of = "FileRange", doc = "Newly durable ranges of unfinished files." },
]

[[message]]
name = "FileRoot"
type = 0x2B
doc = "A large file's BLAKE3 root, sender to receiver, once its last group is read (SPEC.md §13.2)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "file_id", ty = "u32", doc = "The file." },
  { name = "root", ty = "b32", doc = "Its BLAKE3 root (SPEC.md §13.1)." },
]

[[message]]
name = "FileRetry"
type = 0x2C
doc = "The receiver dropped this file; send all of it again (SPEC.md §11.9, §13.3)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "file_id", ty = "u32", doc = "The file." },
  { name = "reason", ty = "u16", doc = "A `RETRY_*` code." },
]

[[message]]
name = "Status"
type = 0x2D
doc = "A job's progress: sent by the receiver every 250 ms, IGNORABLE; also the reply body of `job.status` and the job-starting methods (SPEC.md §7.1, §16.9)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "files_done", ty = "u32", doc = "Files finished." },
  { name = "files_total", ty = "u32", doc = "Files in the job; 0 while unknown." },
  { name = "bytes_received", ty = "u64", doc = "Bytes the receiver has received." },
  { name = "bytes_durable", ty = "u64", doc = "Bytes durable on the receiver." },
  { name = "bytes_total", ty = "u64", doc = "Bytes in the job; 0 while unknown." },
  { name = "bottleneck", ty = "u8", doc = "The receiver's own `BN_*` bottleneck." },
  { name = "workers", ty = "u8", doc = "The receiver's write workers." },
  { name = "lanes", ty = "u8", doc = "Data lanes in use." },
  { name = "sequential", ty = "u8", doc = "Reserved for the sender's sequential choice (SPEC.md §16); version 1 receivers send 0." },
]
ext = [
  { tag = 1, name = "current", ty = "str", doc = "The current step; on a failed job, the cause." },
  { tag = 2, name = "state", ty = "u8", doc = "RPC replies: 0 running, 1 finished OK, 2 failed (SPEC.md §7.1)." },
  { tag = 3, name = "result", ty = "bytes", doc = "`job.run`: the finished operation's reply body, at most 128 KiB (SPEC.md §7.1.1)." },
  { tag = 4, name = "code", ty = "u16", doc = "A failed job's `ERR_*` code." },
  { tag = 5, name = "unswept", ty = "u32", doc = "Durable-by-log: done files not yet durable in place; absent means 0 (SPEC.md §15.7)." },
]

[[message]]
name = "JobDone"
type = 0x2E
doc = "The job ended, receiver to sender; sent after the last durable commit (SPEC.md §12.6)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "status", ty = "u16", doc = "`STATUS_OK` or the `ERR_*` the job ended with." },
  { name = "files", ty = "u32", doc = "Files done." },
  { name = "bytes", ty = "u64", doc = "Bytes durable." },
]
ext = [
  { tag = 1, name = "message", ty = "str", doc = "The cause of a failure, as text." },
  { tag = 2, name = "settling", ty = "u8", doc = "1: the log is durable but files are still being made durable in place (SPEC.md §15.7)." },
]

[[message]]
name = "JobCancel"
type = 0x2F
doc = "Ends a job; either peer may send it, and the receiver keeps the journal (SPEC.md §11.7)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "reason", ty = "u16", doc = "The `ERR_*` code the ender wants reported, such as `ERR_CANCELLED` for a user's cancel." },
]

# Older receivers ignore SkipProgress as an unknown data-plane type.
[[message]]
name = "SkipProgress"
type = 0x30
doc = """
Job-scoped liveness (SPEC.md §12.8): a sender reading past data the receiver already holds (a
solid archive decoded from its start on resume) sends this at least every 10 s; the receiver
counts it as progress for that job."""
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "bytes_skipped", ty = "u64", doc = "Running total of bytes the sender has read past for this job; informational." },
]

# RPC bodies (SPEC.md §16)
[[struct]]
name = "JobCopy"
doc = "The `job.copy` request: copy or move on the node itself (SPEC.md §15.5)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job's id, chosen by the caller; a repeat with the same parameters answers the existing job." },
  { name = "src", ty = "str", doc = "The source path." },
  { name = "dest", ty = "str", doc = "The destination root." },
  { name = "flags", ty = "u32", doc = "`JF_*` bits, such as `JF_MOVE` and `JF_OVERWRITE` (SPEC.md §11.8)." },
]

[[struct]]
name = "JobRef"
doc = "The `job.status` and `job.cancel` request (SPEC.md §7.1)."
fields = [{ name = "job_id", ty = "b16", doc = "The job." }]

[[struct]]
name = "DiskCalibrate"
doc = "The `disk.calibrate` request (SPEC.md §16.10)."
fields = [
  { name = "dir", ty = "str", doc = "Where to write the test files; must pass the node's write policy." },
  { name = "files", ty = "u32", doc = "Files to write per measurement, at most 20,000." },
  { name = "size", ty = "u32", doc = "Bytes per file, at most 1 MiB." },
]

[[struct]]
name = "CalPoint"
doc = "One `disk.calibrate` measurement (SPEC.md §16.10)."
fields = [
  { name = "workers", ty = "u8", doc = "The number of workers writing at once." },
  { name = "files_per_s", ty = "u32", doc = "Files written and synced per second." },
  { name = "create_us", ty = "u32", doc = "Mean microseconds to create and write one file." },
  { name = "fsync_us", ty = "u32", doc = "Mean microseconds to fsync one file." },
]

[[struct]]
name = "DiskCalibrateResult"
doc = "The `disk.calibrate` reply: a hint for a client's starting worker count, not a contract (SPEC.md §16.10)."
fields = [{ name = "points", ty = "records", of = "CalPoint", doc = "One measurement each at 1, 2, 4, 8 and 16 workers." }]

# Node to node (SPEC.md §18).
[[struct]]
name = "C2cAllow"
doc = "The `c2c.allow` request, on the receiving node (SPEC.md §18.1)."
fields = [
  { name = "job_id", ty = "b16", doc = "The one job the ticket admits." },
  { name = "key", ty = "b32", doc = "The sending node's identity (its static X25519 key)." },
  { name = "root", ty = "str", doc = "Where the job may write." },
]

[[struct]]
name = "C2cTicket"
doc = "The `c2c.allow` reply; the sending node shows the token in its `ClientInfo` (SPEC.md §18.1)."
fields = [{ name = "token", ty = "b16", doc = "16 random bytes; valid for 10 minutes from its last use." }]

[[struct]]
name = "C2cSend"
doc = "The `c2c.send` request, on the sending node (SPEC.md §18.2)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job, as allowed on the receiving node." },
  { name = "host", ty = "str", doc = "The receiving node's IPv4 address." },
  { name = "port", ty = "u16", doc = "Its TCP port." },
  { name = "key", ty = "b32", doc = "Its identity; the handshake must prove it." },
  { name = "token", ty = "b16", doc = "The ticket from its `c2c.allow`." },
  { name = "src", ty = "str", doc = "The source path on the sending node." },
  { name = "dest", ty = "str", doc = "The destination root on the receiving node." },
  { name = "flags", ty = "u32", doc = "`JF_*` bits (SPEC.md §11.8)." },
]
[[const]]
name = "METHOD_JOB_RUN"
ty = "u16"
value = 20
doc = "RPC `job.run`: `JobRun` request, `Status` reply; starts an application operation as a job (SPEC.md §7.1.1)."
[[const]]
name = "METHOD_JOB_LIST"
ty = "u16"
value = 21
doc = "RPC `job.list`: empty request, `JobListResult` reply (SPEC.md §7.1.1)."
# Size constants of the application methods (SPEC.md §7.3-§7.4).
[[const]]
name = "RPC_TEXT_MAX"
ty = "u32"
value = 262128
doc = "The largest `MgmtText` text in a reply, in bytes: the 256 KiB reply cap minus 16 (SPEC.md §7.3)."

# Bodies shared by application methods and job.run (SPEC.md §7.1.1, §7.3).
[[struct]]
name = "MgmtText"
doc = "An application method's opaque text body, in practice UTF-8 JSON (SPEC.md §7.3)."
fields = [{ name = "body", ty = "bytes", doc = "The text, carried unchanged." }]
ext = [{ tag = 1, name = "more", ty = "u8", doc = "1: call again with the next offset (paged methods); absent or 0 when the reply is complete." }]

[[struct]]
name = "JobRun"
doc = "The `job.run` request (SPEC.md §7.1.1)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job's id, chosen by the caller." },
  { name = "op", ty = "u8", doc = "The operation, a number the application registered." },
  { name = "args", ty = "bytes", doc = "The operation's request body, opaque to the protocol; at most 60 KiB." },
]

[[struct]]
name = "JobEntry"
doc = "One job in a `job.list` reply (SPEC.md §7.1.1)."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "kind", ty = "u8", doc = "1 upload, 2 download, 3 copy, 4 operation." },
  { name = "state", ty = "u8", doc = "0 running, 1 finished OK, 2 failed." },
  { name = "files_done", ty = "u32", doc = "Files finished." },
  { name = "files_total", ty = "u32", doc = "Files in the job; 0 while unknown." },
  { name = "bytes_done", ty = "u64", doc = "Bytes done (durable, for a transfer)." },
  { name = "bytes_total", ty = "u64", doc = "Bytes in the job; 0 while unknown." },
]

[[struct]]
name = "JobListResult"
doc = "The `job.list` reply: the caller's jobs of every kind (SPEC.md §7.1.1)."
fields = [{ name = "jobs", ty = "records", of = "JobEntry", doc = "One entry per job." }]

# Journal records (SPEC.md §14); never on the wire.
[[struct]]
name = "JnlOpen"
doc = "Journal record kind 1: the job as opened (SPEC.md §14.1). Never on the wire."
fields = [
  { name = "job_id", ty = "b16", doc = "The job." },
  { name = "manifest_hash", ty = "b32", doc = "The hash of the stored manifest." },
  { name = "kind", ty = "u8", doc = "The job's `JOB_*` kind." },
  { name = "flags", ty = "u32", doc = "The job's `JF_*` flags." },
  { name = "staged", ty = "u8", doc = "Bit 0: the tree is written under `<root>.ava-part`; bit 1: the receiver took `<root>` with `mkdir` (SPEC.md §11.6)." },
  { name = "root", ty = "str", doc = "The destination root." },
]

[[struct]]
name = "JnlBatch"
doc = "Journal record kind 2: one sync batch (SPEC.md §14.2). Never on the wire."
fields = [
  { name = "files", ty = "records", of = "FileRun", doc = "Files now done; their ranges are dropped." },
  { name = "ranges", ty = "records", of = "FileRange", doc = "Durable ranges added." },
  { name = "roots", ty = "records", of = "RootItem", doc = "Roots recorded." },
]
# Durable-by-log (SPEC.md §15.7): the pack extension is present when the batch wrote small files to
# the pack log.
ext = [
  { tag = 1, name = "pack_segment", ty = "u32", doc = "Durable-by-log: the pack segment `pack.<n>` that holds this batch's `PackFile` records (SPEC.md §15.7)." },
  { tag = 2, name = "pack_offset", ty = "u64", doc = "Where those records start in the segment, in bytes." },
  { tag = 3, name = "pack_len", ty = "u64", doc = "Their length in bytes." },
]

[[struct]]
name = "PackRef"
doc = "Where a batch's `PackFile` records live; in journal snapshots only (SPEC.md §14.2, §15.7)."
fields = [
  { name = "segment", ty = "u32", doc = "The pack segment `pack.<n>`." },
  { name = "offset", ty = "u64", doc = "Where the records start, in bytes." },
  { name = "len", ty = "u64", doc = "Their length in bytes." },
  { name = "first_file", ty = "u32", doc = "The first file id the records cover." },
  { name = "count", ty = "u32", doc = "File ids covered: `first_file..first_file + count`." },
]

[[struct]]
name = "JnlSweep"
doc = "Journal record kind 6: these files are now durable in place (SPEC.md §14.2, §15.7). Never on the wire."
fields = [{ name = "files", ty = "records", of = "FileRun", doc = "The files swept." }]

[[struct]]
name = "JnlReset"
doc = "Journal record kind 3: forget one file's progress (SPEC.md §14.2). Never on the wire."
fields = [{ name = "file_id", ty = "u32", doc = "The file." }]

[[struct]]
name = "JnlSnapshot"
doc = "Journal record kind 4: the whole state, written when the journal is compacted (SPEC.md §14.1, §14.2). Never on the wire."
fields = [
  { name = "done", ty = "records", of = "FileRun", doc = "Files done." },
  { name = "ranges", ty = "records", of = "FileRange", doc = "Durable ranges of unfinished files." },
  { name = "roots", ty = "records", of = "RootItem", doc = "Roots recorded." },
]
# Records cannot be extensions, so these carry the records' item streams as bytes.
ext = [
  { tag = 1, name = "unswept", ty = "bytes", doc = "The `FileRun` item stream of done files not yet swept (SPEC.md §14.2)." },
  { tag = 2, name = "segments", ty = "bytes", doc = "The `PackRef` item stream of the pack ranges whose files are not all swept (SPEC.md §14.2)." },
]

[[struct]]
name = "JnlDone"
doc = "Journal record kind 5: the job's final status (SPEC.md §14.2). Never on the wire."
fields = [{ name = "status", ty = "u16", doc = "`STATUS_OK` or an `ERR_*` code." }]
