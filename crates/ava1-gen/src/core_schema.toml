ty = "u16"
value = 22
[[const]]
name = "METHOD_C2C_SEND"    # this console sends to another console, directly (SPEC.md §18)
ty = "u16"
value = 23
[[const]]
name = "ERR_PATH"
ty = "u16"
value = 9
[[const]]
name = "ERR_NO_SPACE"
ty = "u16"
value = 10
[[const]]
name = "ERR_UNKNOWN_JOB"
ty = "u16"
value = 11
